name: Setup AX Code Desktop JS toolchain
description: Configure the pinned Node.js and pnpm toolchain for AX Code Desktop workflows

inputs:
  node-version:
    description: Node.js version
    required: false
    default: "26"
  pnpm-version:
    description: pnpm version
    required: false
    default: "10.33.4"

runs:
  using: composite
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      with:
        version: ${{ inputs.pnpm-version }}
        run_install: false

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node-version }}
        # Writes the scope mapping and an auth line that reads NODE_AUTH_TOKEN. The token is passed only
        # to the install step, never exported for the whole job.
        registry-url: https://npm.pkg.github.com
        scope: "@defai-digital"
        cache: pnpm
        cache-dependency-path: pnpm-lock.yaml
