name: CodeQL

on:
  pull_request:
    paths:
      - ".github/**"
      - "config/**"
      - "desktop/**"
      - "package.json"
      - "patches/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "script/**"
      - "turbo.json"
      - "tools/**"
      - ".internal/deploy/**"
  push:
    branches:
      - main
    paths:
      - ".github/**"
      - "config/**"
      - "desktop/**"
      - "package.json"
      - "patches/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "script/**"
      - "turbo.json"
      - "tools/**"
      - ".internal/deploy/**"
  schedule:
    - cron: "23 8 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  javascript-typescript-actions:
    name: JavaScript, TypeScript, and Actions
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript,actions
          queries: +security-and-quality
          config-file: ./.github/codeql/codeql-config.yml

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript-actions"
