name: Desktop CI

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "41 7 * * 1"
  workflow_dispatch:

concurrency:
  # Keep weekly full validation independent of lightweight pushes.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

env:
  AX_CODE_DISABLE_SHARE: "true"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      verify: ${{ steps.scope.outputs.verify }}
      build: ${{ steps.scope.outputs.build }}
      native: ${{ steps.scope.outputs.native }}
      packaged: ${{ steps.scope.outputs.packaged }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "26"

      - name: Select checks from the complete Git diff
        id: scope
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node script/ci-scope.mjs

  verify:
    needs: changes
    if: needs.changes.outputs.verify == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Setup AX Code Desktop toolchain
        uses: ./.github/actions/setup-ax-coder-toolchain

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check repository and release boundaries
        run: pnpm run check:boundaries

      - name: Validate desktop translations
        run: pnpm run check:locales

      - name: Typecheck Desktop
        run: pnpm run typecheck

      - name: Lint Desktop
        run: pnpm run lint

      - name: Test Desktop
        run: pnpm run test

      - name: Build Desktop
        if: needs.changes.outputs.build == 'true'
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm run build

  electron-native-compatibility:
    needs: changes
    if: needs.changes.outputs.native == 'true'
    name: Electron native smoke (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, windows-2022, ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Setup AX Code Desktop toolchain
        uses: ./.github/actions/setup-ax-coder-toolchain

      - name: Install Linux display and Electron libraries
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y xvfb xauth libgtk-3-0t64
          libnss3 libasound2t64 libgbm1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Rebuild native modules for Electron
        run: pnpm --filter @ax-code/electron run rebuild:native

      - name: Bundle runtime and animation assets for native smoke
        run: pnpm --filter @ax-code/electron run bundle:main

      - name: Verify Windows ASAR layout and block integrity
        if: runner.os == 'Windows'
        run: pnpm --filter @ax-code/electron exec vitest run scripts/verify-packaged-electron.test.mjs

      - name: Verify literal Windows launcher paths and Wiki window cleanup
        if: runner.os == 'Windows'
        run: pnpm --filter @ax-code/electron exec vitest run src/axcode-runtime-supervisor.test.mjs src/wiki-viewer.test.mjs -t "runs a real batch launcher|official Wiki viewer"

      - name: Validate Windows bootstrap and native OS architecture
        if: runner.os == 'Windows'
        run: pnpm exec vitest run --config vitest.config.ts script/desktop-windows-bootstrap.test.mjs script/windows-minisign-acl.test.mjs

      - name: Configure the installed Electron sandbox helper
        if: runner.os == 'Linux'
        working-directory: desktop/packages/electron
        run: |
          node -e 'require("electron")'
          sandbox_helper="$(node -e 'const path = require("node:path"); process.stdout.write(path.join(path.dirname(require.resolve("electron/package.json")), "dist", "chrome-sandbox"))')"
          sudo chown root:root "$sandbox_helper"
          sudo chmod 4755 "$sandbox_helper"

      - name: Smoke native menus, PTY, and WebMCP
        if: runner.os != 'Linux'
        shell: bash
        run: |
          pnpm run smoke:electron-compatibility
          pnpm run smoke:session-cors
          pnpm run smoke:launch-animations -- --asar
          pnpm run smoke:native-webmcp -- --output-dir "$RUNNER_TEMP/native-webmcp"

      - name: Smoke native menus, PTY, and WebMCP with a display
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a pnpm run smoke:electron-compatibility
          xvfb-run -a pnpm run smoke:session-cors
          xvfb-run -a pnpm run smoke:launch-animations -- --asar
          xvfb-run -a pnpm run smoke:native-webmcp -- --output-dir "$RUNNER_TEMP/native-webmcp"

      - name: Retain native capability evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-webmcp-${{ matrix.runner }}-${{ github.run_id }}
          path: ${{ runner.temp }}/native-webmcp
          if-no-files-found: ignore
          retention-days: 3

  packaged-macos-smoke:
    needs: changes
    if: needs.changes.outputs.packaged == 'true'
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Setup AX Code Desktop toolchain
        uses: ./.github/actions/setup-ax-coder-toolchain

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Minisign
        run: brew install minisign

      - name: Build Desktop
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm run build

      - name: Package isolated unsigned app
        env:
          APPLE_KEYCHAIN_PROFILE: ""
          AX_CODE_STAGE_REQUIRED: "true"
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: >-
          pnpm run package:desktop -- --mac --arm64 --dir --publish=never
          --config.mac.identity=null --config.mac.notarize=false

      - name: Smoke packaged app and bundled runtime
        env:
          AX_CODE_DESKTOP_DISABLE_AUTO_UPDATE: "1"
          AX_CODE_STAGE_REQUIRED: "true"
        run: pnpm run smoke:packaged -- --artifacts "$RUNNER_TEMP/desktop-smoke"

      # SPEC-2026-10-19-desktop-e2e-harness-v1: non-blocking until flake data
      # supports promotion to a required check.
      - name: End-to-end renderer journeys (unpackaged)
        id: e2e-unpackaged
        continue-on-error: true
        run: pnpm run e2e:desktop -- --artifacts "$RUNNER_TEMP/desktop-e2e/unpackaged"

      - name: End-to-end renderer journeys (packaged app://)
        id: e2e-packaged
        continue-on-error: true
        run: >-
          pnpm run e2e:desktop -- --app "desktop/packages/electron/dist/mac-arm64/AX Code.app"
          --artifacts "$RUNNER_TEMP/desktop-e2e/packaged"

      - name: Prove renderer failure detection across reload
        id: e2e-self-test
        continue-on-error: true
        run: pnpm run e2e:desktop:self-test -- --artifacts "$RUNNER_TEMP/desktop-e2e/self-test"

      - name: Upload smoke diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-ci-macos-smoke-${{ github.run_id }}
          path: ${{ runner.temp }}/desktop-smoke
          if-no-files-found: ignore
          retention-days: 3

      - name: Upload end-to-end artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-ci-macos-e2e-${{ github.run_id }}
          path: ${{ runner.temp }}/desktop-e2e
          if-no-files-found: ignore
          retention-days: 3

      - name: Summarize advisory renderer journeys
        if: always()
        shell: bash
        env:
          UNPACKAGED: ${{ steps.e2e-unpackaged.outcome }}
          PACKAGED: ${{ steps.e2e-packaged.outcome }}
          SELF_TEST: ${{ steps.e2e-self-test.outcome }}
        run: |
          {
            echo "### Renderer E2E (advisory during qualification)"
            echo "Unpackaged: ${UNPACKAGED:-not run}; packaged: ${PACKAGED:-not run}"
            echo "Failure-detection self-test: ${SELF_TEST:-not run}"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$UNPACKAGED" = failure ] || [ "$PACKAGED" = failure ] || [ "$SELF_TEST" = failure ]; then
            echo "::warning::Renderer E2E failed; inspect the retained journey results and screenshots."
          fi

  supervision-journeys:
    needs: changes
    if: needs.changes.outputs.build == 'true' || needs.changes.outputs.native == 'true'
    name: Supervision journeys (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Setup AX Code Desktop toolchain
        uses: ./.github/actions/setup-ax-coder-toolchain

      - name: Install Linux display and Electron libraries
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y xvfb xauth libgtk-3-0t64
          libnss3 libasound2t64 libgbm1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Rebuild native modules for Electron
        run: pnpm --filter @ax-code/electron run rebuild:native

      - name: Configure the installed Electron sandbox helper
        if: runner.os == 'Linux'
        working-directory: desktop/packages/electron
        run: |
          node -e 'require("electron")'
          sandbox_helper="$(node -e 'const path = require("node:path"); process.stdout.write(path.join(path.dirname(require.resolve("electron/package.json")), "dist", "chrome-sandbox"))')"
          sudo chown root:root "$sandbox_helper"
          sudo chmod 4755 "$sandbox_helper"

      - name: Build Desktop
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm run build

      # SPEC-2026-10-19-desktop-e2e-harness-v1: advisory, like the macOS renderer journeys, until flake data on each
      # platform supports promotion. Mission Control, the session opened beside the chat (Chat, Changes, Files,
      # Terminal) and review run against real Git fixtures on every desktop platform AX Code Desktop ships for.
      - name: Supervision, portfolio, project-home and project-browser journeys
        id: journeys
        continue-on-error: true
        shell: bash
        run: |
          run() { if [ "$RUNNER_OS" = Linux ]; then xvfb-run -a "$@"; else "$@"; fi; }
          status=0
          for journey in supervision-workspace portfolio-identity project-home project-archive-all project-browser; do
            run node "desktop/packages/electron/scripts/e2e/${journey}-webmcp.mjs" \
              --artifacts "$RUNNER_TEMP/supervision-journeys/${journey}" || status=1
          done
          # Task suite W7: two projects, each with a session and its own page.
          run node desktop/packages/electron/scripts/e2e/project-browser-sessions.mjs \
            --artifacts "$RUNNER_TEMP/supervision-journeys/project-browser-sessions" || status=1
          run node desktop/packages/electron/scripts/e2e/project-browser-tasks.mjs \
            --artifacts "$RUNNER_TEMP/supervision-journeys/project-browser-tasks" || status=1
          exit "$status"

      - name: Upload journey artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: supervision-journeys-${{ matrix.runner }}-${{ github.run_id }}
          path: ${{ runner.temp }}/supervision-journeys
          if-no-files-found: ignore
          retention-days: 3

      - name: Summarize advisory journeys
        if: always()
        shell: bash
        env:
          OUTCOME: ${{ steps.journeys.outcome }}
        run: |
          echo "### Supervision journeys on ${RUNNER_OS}: ${OUTCOME:-not run}" >> "$GITHUB_STEP_SUMMARY"
          if [ "$OUTCOME" = failure ]; then
            echo "::warning::Supervision journeys failed on ${RUNNER_OS}; inspect the retained results and screenshots."
          fi

  required-checks:
    name: Desktop required checks
    if: always()
    needs: [changes, verify, electron-native-compatibility, packaged-macos-smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "26"
      - name: Require every selected check to succeed
        env:
          CI_CHANGES: ${{ needs.changes.result }}
          CI_VERIFY_REQUIRED: ${{ needs.changes.outputs.verify }}
          CI_VERIFY: ${{ needs.verify.result }}
          CI_NATIVE_REQUIRED: ${{ needs.changes.outputs.native }}
          CI_NATIVE: ${{ needs.electron-native-compatibility.result }}
          CI_PACKAGED_REQUIRED: ${{ needs.changes.outputs.packaged }}
          CI_PACKAGED: ${{ needs.packaged-macos-smoke.result }}
        run: node script/ci-required-checks.mjs
