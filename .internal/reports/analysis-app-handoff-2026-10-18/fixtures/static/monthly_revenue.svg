<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-labelledby="title desc">
  <title id="title">Monthly Revenue — 2026 Q1</title>
  <desc id="desc">Bar chart of total monthly revenue: Jan 2026: 250, Feb 2026: 300, Mar 2026: 300.</desc>

  <!-- Background -->
  <rect x="0" y="0" width="800" height="500" fill="#ffffff"/>

  <!-- Title and subtitle -->
  <text x="400" y="36" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#1f2937">Monthly Revenue — 2026 Q1</text>
  <text x="400" y="60" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#6b7280">Aggregated across East and West regions</text>

  <!-- Gridlines (0, 100, 200, 300) -->
  <g stroke="#e5e7eb" stroke-width="1">
    <line x1="100" y1="400" x2="740" y2="400"/>
    <line x1="100" y1="308.57" x2="740" y2="308.57"/>
    <line x1="100" y1="217.14" x2="740" y2="217.14"/>
    <line x1="100" y1="125.71" x2="740" y2="125.71"/>
  </g>

  <!-- Y-axis tick labels -->
  <g font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end">
    <text x="92" y="404">0</text>
    <text x="92" y="312.57">100</text>
    <text x="92" y="221.14">200</text>
    <text x="92" y="129.71">300</text>
  </g>

  <!-- Bars -->
  <g fill="#4472C4" stroke="#2f5496" stroke-width="1">
    <!-- Jan: 250 -> height 228.57, y = 171.43 -->
    <rect x="147" y="171.43" width="120" height="228.57"/>
    <!-- Feb: 300 -> height 274.29, y = 125.71 -->
    <rect x="360" y="125.71" width="120" height="274.29"/>
    <!-- Mar: 300 -->
    <rect x="573" y="125.71" width="120" height="274.29"/>
  </g>

  <!-- Value labels on bars -->
  <g font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="middle">
    <text x="207" y="161">250</text>
    <text x="420" y="116">300</text>
    <text x="633" y="116">300</text>
  </g>

  <!-- Baseline -->
  <line x1="100" y1="400" x2="740" y2="400" stroke="#9ca3af" stroke-width="1.5"/>

  <!-- X-axis month labels -->
  <g font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#374151" text-anchor="middle">
    <text x="207" y="424">Jan 2026</text>
    <text x="420" y="424">Feb 2026</text>
    <text x="633" y="424">Mar 2026</text>
  </g>

  <!-- Axis titles -->
  <text x="24" y="240" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" transform="rotate(-90 24 240)">Revenue</text>
  <text x="420" y="452" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Month</text>

  <!-- Footer summary -->
  <text x="400" y="484" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#6b7280">Q1 total: 850&#160;&#160;|&#160;&#160;East: 360&#160;&#160;|&#160;&#160;West: 490&#160;&#160;|&#160;&#160;Source: sales.csv</text>
</svg>
