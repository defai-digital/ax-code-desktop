<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content"
    />

    <!-- Favicon -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/favicon-32.png" sizes="32x32" />
    <link rel="icon" type="image/png" href="/favicon-16.png" sizes="16x16" />
    <link rel="apple-touch-icon" href="/favicon-512.png" />

    <script>
      // Blocking script to detect and apply theme before first paint
      ;(function () {
        try {
          var themeMode = localStorage.getItem("themeMode")
          var variant = localStorage.getItem("selectedThemeVariant")
          var useSystem = localStorage.getItem("useSystemTheme")
          var isDark

          // Check themeMode first (new storage key)
          if (themeMode === "dark") {
            isDark = true
          } else if (themeMode === "light") {
            isDark = false
          } else if (themeMode === "system" || useSystem === null || useSystem === "true") {
            // System preference
            isDark = window.matchMedia("(prefers-color-scheme: dark)").matches
          } else if (variant === "light" || variant === "dark") {
            // Legacy storage key fallback
            isDark = variant === "dark"
          } else {
            // Default to system
            isDark = window.matchMedia("(prefers-color-scheme: dark)").matches
          }

          // Apply theme class and data attribute
          document.documentElement.classList.add(isDark ? "dark" : "light")
          document.documentElement.setAttribute("data-splash-variant", isDark ? "dark" : "light")
          document.documentElement.style.setProperty("color-scheme", isDark ? "dark" : "light")

          // Splash colors persisted by the app theme system
          var splashBgLight = localStorage.getItem("splashBgLight")
          var splashFgLight = localStorage.getItem("splashFgLight")
          var splashBgDark = localStorage.getItem("splashBgDark")
          var splashFgDark = localStorage.getItem("splashFgDark")

          if (splashBgLight) document.documentElement.style.setProperty("--splash-background-light", splashBgLight)
          if (splashFgLight) document.documentElement.style.setProperty("--splash-stroke-light", splashFgLight)
          if (splashBgDark) document.documentElement.style.setProperty("--splash-background-dark", splashBgDark)
          if (splashFgDark) document.documentElement.style.setProperty("--splash-stroke-dark", splashFgDark)
        } catch (error) {
          console.warn("Failed to apply theme:", error)
        }
      })()
    </script>

    <!-- Theme color -->
    <meta name="theme-color" content="#F7F7F7" />
    <meta name="theme-color" content="#0A0A0A" media="(prefers-color-scheme: dark)" />

    <title>AX Code - AI Coding Assistant</title>
    <meta name="description" content="Web interface companion for AX Code AI coding agent" />
    <meta name="application-name" content="AX Code" />

    <!-- Inline CSS for loading screen and Nerd Fonts (before Tailwind loads) -->
    <style>
      /* Nerd Font @font-face declarations for terminal icon support. Local installs only:
         font-src allows 'self' and data:, so remote files would be blocked anyway. */
      @font-face {
        font-family: "JetBrainsMono Nerd Font";
        src: local("JetBrainsMono Nerd Font");
        font-weight: normal;
        font-style: normal;
        font-display: swap;
        unicode-range: U+E000-F8FF, U+F0000-FFFFF;
      }

      @font-face {
        font-family: "FiraCode Nerd Font";
        src: local("FiraCode Nerd Font");
        font-weight: normal;
        font-style: normal;
        font-display: swap;
        unicode-range: U+E000-F8FF, U+F0000-FFFFF;
      }

      /* Defaults match the AutomatosX theme canvas (and the native window colour in
         electron/src/desktop-window-chrome.js) until the app persists its own. */
      :root {
        --splash-background-dark: #0a0a0a;
        --splash-stroke-dark: #ededed;
        --splash-background-light: #f7f7f7;
        --splash-stroke-light: #171717;

        --splash-background: var(--splash-background-dark);
        --splash-stroke: var(--splash-stroke-dark);
        --splash-foreground: var(--splash-stroke-dark);
      }

      html[data-splash-variant="light"] {
        --splash-background: var(--splash-background-light);
        --splash-stroke: var(--splash-stroke-light);
        --splash-foreground: var(--splash-stroke-light);
      }

      html[data-splash-variant="dark"] {
        --splash-background: var(--splash-background-dark);
        --splash-stroke: var(--splash-stroke-dark);
        --splash-foreground: var(--splash-stroke-dark);
      }
      #initial-loading {
        background-color: var(--splash-background);
        color: var(--splash-foreground);
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        transition: opacity 0.3s ease-out;
        position: absolute;
        width: 100%;
        z-index: 9999;
        /* The desktop shell hides the native title bar; keep the window draggable while booting. */
        -webkit-app-region: drag;
      }
      #initial-loading.fade-out {
        opacity: 0;
        pointer-events: none;
        -webkit-app-region: no-drag;
      }
    </style>
  </head>
  <body class="h-full bg-background text-foreground">
    <div id="root" class="h-full">
      <!-- Blank loading gate while React and desktop boot state initialize. -->
      <div id="initial-loading"></div>
    </div>

    <script>
      // Fallback: hide loading screen after 10 seconds if React fails to load.
      // Desktop shells manage their own splash via the injected boot outcome;
      // do not force-remove for desktop windows.
      setTimeout(function () {
        if (
          typeof window.__AX_CODE_DESKTOP_LOCAL_ORIGIN__ === "string" &&
          window.__AX_CODE_DESKTOP_LOCAL_ORIGIN__.length > 0
        ) {
          return
        }
        var loading = document.getElementById("initial-loading")
        if (loading) {
          console.warn("Loading screen timeout - forcing hide after 10s")
          loading.classList.add("fade-out")
          setTimeout(function () {
            loading.remove()
          }, 300)
        }
      }, 10000)
    </script>

    <!-- Terminal font stack: locally installed Nerd Fonts apply through .fonts-loaded.
         Remote font files are not fetched: font-src allows only 'self' and data:. -->
    <script>
      document.documentElement.classList.add("fonts-loaded")
    </script>

    <!-- Polyfill for process before loading React -->
    <script>
      if (typeof process === "undefined") {
        window.process = { env: {} }
      }
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
